{% extends 'base.html' %}

{% block title %}Edit Collection - Smart Payroll System{% endblock %}

{% block content %}
<div class="mb-6">
    <h1 class="text-3xl font-bold text-gray-800">
        <i class="fas fa-edit mr-2"></i>Edit Collection
    </h1>
</div>

<div class="bg-white rounded-lg shadow-md p-6 max-w-2xl">
    <form method="post">
        {% csrf_token %}
        <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2">Employee</label>
            <input type="text" value="{{ collection.employee.get_full_name|default:collection.employee.username }}" class="border rounded-lg px-4 py-2 w-full bg-gray-100" readonly>
        </div>
        <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2">Date</label>
            <input type="text" value="{{ collection.date|date:'Y-m-d' }}" class="border rounded-lg px-4 py-2 w-full bg-gray-100" readonly>
        </div>
        <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2">Amount Collected (₹) *</label>
            <input type="number" name="amount_collected" value="{{ collection.amount_collected }}" step="0.01" min="0" class="border rounded-lg px-4 py-2 w-full" required>
        </div>
        <div class="mb-6">
            <label class="block text-gray-700 text-sm font-bold mb-2">Incentive Earned (Auto-calculated)</label>
            <input type="text" value="₹{{ collection.incentive_earned|floatformat:2 }}" class="border rounded-lg px-4 py-2 w-full bg-gray-100" readonly>
        </div>
        <div class="flex gap-4">
            <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg">
                <i class="fas fa-save mr-2"></i>Save
            </button>
            <a href="{% url 'incentives:collection_list' %}" class="bg-gray-500 hover:bg-gray-600 text-white font-bold py-2 px-6 rounded-lg">
                <i class="fas fa-times mr-2"></i>Cancel
            </a>
        </div>
    </form>
</div>
{% endblock %}
